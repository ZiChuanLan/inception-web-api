services:
  inception-web-api:
    build: .
    container_name: inception-web-api
    restart: always
    ports:
      - "8011:8011"
    environment:
      - PORT=8011
      - HOST=0.0.0.0
      - ENGINE=browser
      # - API_KEY=sk-your-secret-key-here
      # - PROXY_URL=http://your-proxy-here:port
      # - CHROME_PATH=/usr/bin/google-chrome
    shm_size: '512mb'
